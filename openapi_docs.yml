openapi: 3.0.0

info:
  title: Car Renting API
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: base url

tags:
  - name: Authentication
    description: User registration and login
  - name: Email Verification
    description: User Email Verification
  - name : 2fa
    description: 2 Factor Authentication

paths:
  /api/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                first_name: John
                last_name: Doe
                email: JohnDoe@example.com
                password: password
                phone_number: "+111111111"
                agreed_terms: true
      responses:
        "201":
          description: Success
        "400":
          description: Bad Request

  /api/login:
    post:
      tags:
        - Authentication
      summary: Log in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                email: JohnDoe@example.com
                password: password
      responses:
        "200":
          description: Login successful
        "401":
          description: Wrong credentials
        "400":
          description: Bad Request

  /api/verify:
    post:
      tags:
        - Email Verification
      summary: Verify Email Address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                token: token
      responses:
        "200":
          description: Verification Successful
        "401":
          description: Invalid token
        "500":
          description: Server failure

  /api/verify/refresh:
    patch:
      tags:
        - Email Verification
      summary: Refresh verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                token: token
      responses:
        "200":
          description: Token refresh successful
        "401":
          description: Invalid token
        "500":
          description: Server failure
  /api/verify/resend:
    post:
      tags:
        - Email Verification
      summary: resed Email Verification
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                email: joe@example.com
      responses: 
        "202":
          description: request Accepted
        "400":
          description: Invalid Request
        "403":
          description: User is already verified
        "401":
          description: No User Found

  /api/2fa/verify:
    post:
      tags:
        - 2fa
      summary: verify 2Fa code
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                email: joe@example.com
                code : 123123123
      responses: 
        "200":
          description: verification successful
        "400":
          description: InvalidBodyError
        "401":
          description: InvalidUserError, InvalidCodeError, CodeExpiredError or TokenError
  

  /api/2fa/refresh:
    post:
      tags:
       - 2fa
      summary: request be 2fa code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                email: joe@example.com
      responses:
        "202":
          description: request Accepted
        "400":
          description: InvalidBodyError
        "401":
          description: InvalidUserError
        "500":
          description: ServerError

  /api/2fa/resend:
    post:
      tags:
       - 2fa
      summary: request resending of the 2fa code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                email: joe@example.com
      responses:
        "202":
          description: request Accepted
        "400":
          description: InvalidBodyError
        "401":
          description: InvalidUserError, CodeExpiredError or TokenError