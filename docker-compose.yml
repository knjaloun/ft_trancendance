services:
  mysql:
    image: mysql:latest
    container_name: mysql-container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PSW}
      MYSQL_DATABASE: trancendance
      MYSQL_TCP_PORT: 5310
    ports:
      - "5310:5310"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "5310", "-uroot", "-p${DB_ROOT_PSW}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - transcendence

  redis:
    image: redis:latest
    container_name: redis-container
    restart: unless-stopped
    ports:
      - "6000:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - transcendence

volumes:
  mysql-data:
  redis-data:

networks:
  transcendence:
    driver: bridge
