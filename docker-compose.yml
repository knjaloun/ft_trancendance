services:
  mysql:
    image: mysql:latest
    container_name: mysql-container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PSW}
      MYSQL_DATABASE: trancendance
      MYSQL_TCP_PORT: 5310
    ports:
      - "5310:5310"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "5310", "-uroot", "-p${DB_ROOT_PSW}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - transcendence

  redis:
    image: redis:latest
    container_name: redis-container
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - transcendence

  backend:
    build:
      context: ./backend
    image: transcendence-backend
    container_name: backend-container
    restart: unless-stopped
    command: ["api"]
    env_file:
      - .env
    environment:
      # These override whatever the local .env holds: inside the compose network
      # the services are reachable by service name, not on localhost.
      PORT: 3000
      HOST: mysql
      DB_PORT: 5310
      MYSQL_URL: mysql://root:${DB_ROOT_PSW}@mysql:5310/trancendance
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Public URL used to build the activation link sent by email.
      APP_URL: https://localhost:${HTTPS_PORT:-8443}
      CORS_ORIGIN: https://localhost:${HTTPS_PORT:-8443}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transcendence

  worker:
    image: transcendence-backend
    container_name: worker-container
    restart: unless-stopped
    command: ["worker"]
    env_file:
      - .env
    environment:
      HOST: mysql
      DB_PORT: 5310
      MYSQL_URL: mysql://root:${DB_ROOT_PSW}@mysql:5310/trancendance
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: https://localhost:${HTTPS_PORT:-8443}
    depends_on:
      backend:
        condition: service_started
    networks:
      - transcendence

  frontend:
    build:
      context: ./frontend/app
    image: transcendence-frontend
    container_name: frontend-container
    restart: unless-stopped
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - transcendence

volumes:
  mysql-data:
  redis-data:

networks:
  transcendence:
    driver: bridge
