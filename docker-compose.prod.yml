services:
  backend:
    build:
      context: ./backend
      target: runtime
    image: transcendence-backend
    container_name: backend-container
    restart: unless-stopped
    command: ["api"]
    env_file:
      - .env
    environment:
      PORT: 3000
      HOST: mysql
      DB_PORT: 5310
      MYSQL_URL: mysql://root:${DB_ROOT_PSW}@mysql:5310/trancendance
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: https://localhost:${HTTPS_PORT:-8443}
      CORS_ORIGIN: https://localhost:${HTTPS_PORT:-8443}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transcendence

  worker:
    image: transcendence-backend
    container_name: worker-container
    restart: unless-stopped
    command: ["worker"]
    env_file:
      - .env
    environment:
      HOST: mysql
      DB_PORT: 5310
      MYSQL_URL: mysql://root:${DB_ROOT_PSW}@mysql:5310/trancendance
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: https://localhost:${HTTPS_PORT:-8443}
    depends_on:
      backend:
        condition: service_started
    networks:
      - transcendence

  frontend:
    build:
      context: ./frontend/app
      target: runtime
    image: transcendence-frontend
    container_name: frontend-container
    restart: unless-stopped
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - transcendence
